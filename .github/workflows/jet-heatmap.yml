name: Update Jet Heatmap SVG

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate.mjs"
      - "package.json"
      - ".github/workflows/jet-heatmap.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Jet Heatmap SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jet heatmap SVG [skip ci]"
          file_pattern: dist/github-jet.svg
